name: Dependency audit
# Zero known vulnerabilities in any lockfile, dev dependencies included (npm run audit).
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: node scripts/audit.mjs
